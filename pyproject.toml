[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gostfetch"
version = "0.2.0"
description = "Distro logo on the left, live CPU/RAM/GPU/network monitor on the right"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caand" }]
keywords = ["cli", "monitor", "fastfetch", "btop", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
gostfetch = "gostfetch:cli"

[tool.setuptools]
py-modules = ["gostfetch"]
